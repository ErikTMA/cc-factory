eight="22" rx="4" fill="#a0522d" stroke="#374151"/><text x="658" y="252" font-size="13" fill="#1f2937">chests: turtle homes</text><rect x="626" y="266" width="22" height="22" rx="4" fill="#4b5563" stroke="#374151"/><text x="658" y="282" font-size="13" fill="#1f2937">turtle (arrow = facing)</text><rect x="626" y="296" width="22" height="22" rx="4" fill="#9ca3af" stroke="#374151"/><text x="658" y="312" font-size="13" fill="#1f2937">disk drive + floppy</text><text x="24" y="392" font-size="13" fill="#1f2937">Everything with a wired modem joins the network; the base sorts blocks by type:</text><text x="24" y="414" font-size="13" fill="#1f2937">barrels = storage, plain chests = turtle homes (drained), furnaces smelt.</text><text x="24" y="436" font-size="13" fill="#1f2937">Right-click each modem once so its red ring lights up (connects the block to the network).</text></svg>