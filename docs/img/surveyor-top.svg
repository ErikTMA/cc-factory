<svg xmlns="http://www.w3.org/2000/svg" width="896" height="432" viewBox="0 0 896 432" font-family="DejaVu Sans, Verdana, sans-serif"><defs><marker id="head" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#d97706"/></marker></defs><rect width="100%" height="100%" fill="#fafaf9"/><text x="24" y="34" font-size="20" font-weight="bold" fill="#1f2937">Surveyor: place it in front of the base computer (top view)</text><polyline points="222.0,210.0 222.0,166.0 486.0,166.0" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="442.0,122.0 442.0,166.0" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="69" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="113" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="157" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="201" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="245" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="289" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="333" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="377" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="421" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="465" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="509" y="189" width="42" height="42" rx="4" fill="#8a8a8a" stroke="#5f5f5f" stroke-width="1.5"/><rect x="201" y="189" width="42" height="42" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/><text x="222.0" y="213.66666666666666" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#1f2937">modem</text><rect x="201" y="233" width="42" height="42" rx="4" fill="#e8c547" stroke="#374151" stroke-width="1.5"/><text x="222.0" y="257.6666666666667" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#1f2937">base</text><rect x="201" y="277" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="222.0,283.0 231.0,304.0 213.0,304.0" fill="#d97706"/><text x="222.0" y="315" font-size="9" text-anchor="middle" fill="#fff">surveyor</text><rect x="333" y="101" width="42" height="42" rx="4" fill="#a0522d" stroke="#374151" stroke-width="1.5"/><text x="354.0" y="125.66666666666667" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#fff">chest</text><rect x="377" y="101" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="413.0,122.0 392.0,131.0 392.0,113.0" fill="#d97706"/><text x="398.0" y="139" font-size="9" text-anchor="middle" fill="#fff">home</text><rect x="421" y="101" width="42" height="42" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/><polyline points="222.0,298.0 288.0,298.0 288.0,144.0 380.4,144.0" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#head)"/><text x="277.0" y="265.0" font-size="12" text-anchor="start" fill="#d97706">climbs up the wall and over (never digs)</text><text x="332.0" y="95.6" font-size="11" text-anchor="start" fill="#1f2937">home: chest behind, modem in front</text><rect x="582" y="56" width="22" height="22" rx="4" fill="#e8c547" stroke="#374151"/><text x="614" y="72" font-size="13" fill="#1f2937">base computer</text><rect x="582" y="86" width="22" height="22" rx="4" fill="#4b5563" stroke="#374151"/><text x="614" y="102" font-size="13" fill="#1f2937">surveyor (plain turtle)</text><rect x="582" y="116" width="22" height="22" rx="4" fill="#8a8a8a" stroke="#374151"/><text x="614" y="132" font-size="13" fill="#1f2937">wall</text><rect x="582" y="146" width="22" height="22" rx="4" fill="#d1d5db" stroke="#374151"/><text x="614" y="162" font-size="13" fill="#1f2937">wired modem</text><rect x="582" y="176" width="22" height="22" rx="4" fill="#a0522d" stroke="#374151"/><text x="614" y="192" font-size="13" fill="#1f2937">home chest</text><rect x="582" y="206" width="22" height="22" rx="4" fill="#d97706" stroke="#374151"/><text x="614" y="222" font-size="13" fill="#1f2937">its route (over the wall)</text><text x="24" y="348" font-size="13" fill="#1f2937">Place a plain advanced turtle in front of the base computer and run: surveyor &lt;facing&gt;</text><text x="24" y="370" font-size="13" fill="#1f2937">(the way it looks, from F3). Give it coal and a few cobblestone (one marker per home).</text><text x="24" y="392" font-size="13" fill="#1f2937">It climbs walls next to cables but never digs: cables buried in walls are not found.</text><text x="24" y="414" font-size="13" fill="#1f2937">Every free spot beside a home chest with a modem next to it becomes a home (role: off).</text></svg>