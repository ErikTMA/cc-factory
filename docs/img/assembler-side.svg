6" stroke-width="1.5" stroke-dasharray="6 4"/><text x="178.0" y="119.66666666666667" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#d97706">build</text><text x="178.0" y="131.66666666666669" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#d97706">spot</text><rect x="157" y="145" width="42" height="42" rx="4" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/><text x="178.0" y="163.66666666666666" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#1f2937">disk</text><text x="178.0" y="175.66666666666666" font-size="11.0" text-anchor="middle" font-weight="bold" fill="#1f2937">drive</text><rect x="201" y="145" width="42" height="42" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/><text x="24" y="86.8" font-size="11" text-anchor="start" fill="#6b7280">to the base network</text><text x="252.8" y="133.0" font-size="11" text-anchor="start" fill="#6b7280">to the base network</text><rect x="406" y="56" width="22" height="22" rx="4" fill="#4b5563" stroke="#374151"/><text x="438" y="72" font-size="13" fill="#1f2937">assembler (crafting table)</text><rect x="406" y="86" width="22" height="22" rx="4" fill="#9ca3af" stroke="#374151"/><text x="438" y="102" font-size="13" fill="#1f2937">disk drive + floppy</text><rect x="406" y="116" width="22" height="22" rx="4" fill="#d1d5db" stroke="#374151"/><text x="438" y="132" font-size="13" fill="#1f2937">wired modem (enabled)</text><text x="24" y="216" font-size="13" fill="#1f2937">The assembler faces the build spot. Keep the build spot empty: new turtles appear there.</text><text x="24" y="238" font-size="13" fill="#1f2937">Its wired modem is enabled (right-click it): the base pushes parts straight into the</text><text x="24" y="260" font-size="13" fill="#1f2937">assembler and takes results back. The disk drive goes UNDER the build spot.</text></svg>