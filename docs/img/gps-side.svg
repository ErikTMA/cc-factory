="11.0" text-anchor="middle" font-weight="bold" fill="#d97706">spot</text><rect x="113" y="145" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="149.0,166.0 128.0,175.0 128.0,157.0" fill="#d97706"/><text x="134.0" y="183" font-size="9" text-anchor="middle" fill="#fff">GPS</text><rect x="465" y="145" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="501.0,166.0 480.0,175.0 480.0,157.0" fill="#d97706"/><text x="486.0" y="183" font-size="9" text-anchor="middle" fill="#fff">GPS</text><rect x="201" y="189" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="237.0,210.0 216.0,219.0 216.0,201.0" fill="#d97706"/><text x="222.0" y="227" font-size="9" text-anchor="middle" fill="#fff">GPS</text><rect x="421" y="57" width="42" height="42" rx="4" fill="#4b5563" stroke="#111827" stroke-width="1.5"/><polygon points="457.0,78.0 436.0,87.0 436.0,69.0" fill="#d97706"/><text x="442.0" y="95" font-size="9" text-anchor="middle" fill="#fff">GPS</text><text x="134.0" y="135.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#d97706">y 20</text><text x="486.0" y="135.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#d97706">y 20</text><text x="222.0" y="179.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#d97706">y 20 (behind)</text><text x="393.6" y="78.0" font-size="12" text-anchor="end" font-weight="bold" fill="#d97706">y 26</text><polyline points="310.0,386.0 310.0,262.8" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#head)"/><rect x="582" y="56" width="22" height="22" rx="4" fill="#4b5563" stroke="#374151"/><text x="614" y="72" font-size="13" fill="#1f2937">GPS host turtle</text><rect x="582" y="86" width="22" height="22" rx="4" fill="#d97706" stroke="#374151"/><text x="614" y="102" font-size="13" fill="#1f2937">height above the build spot</text><text x="24" y="480" font-size="13" fill="#1f2937">Press BUILD GPS on the FACTORY tab: the factory builds 4 iron turtles with a compass and a</text><text x="24" y="502" font-size="13" fill="#1f2937">wireless modem (4 ender pearls) and they fly to (-4,20,-4) (4,20,-4) (-4,20,4) (4,26,4)</text><text x="24" y="524" font-size="13" fill="#1f2937">from the build spot. One is higher on purpose: four points in one flat plane can't tell</text><text x="24" y="546" font-size="13" fill="#1f2937">above from below. Keep the sky above the base open so they can fly up.</text></svg>